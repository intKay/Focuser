<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focuser 连接设置</title><link rel="stylesheet" href="blocked.css"></head><body><main><div class="icon">◷</div><h1>连接这台电脑</h1><p>先启动 Focuser 本地服务，再连接扩展。不同浏览器共享同一服务与每日额度。</p><label for="port">本地服务端口</label><input id="port" type="number" min="1024" max="65535" value="18765"><label for="browser-name">浏览器名称（仅用于连接状态）</label><select id="browser-name"><option value="">自动识别</option>Chrome</option><option>Edge</option><option>Firefox</option><option>Brave</option><option>Opera</option><option>Chromium</option><option>Vivaldi</option></select><p class="small">自动识别显示为 Chrome 时，选择当前浏览器。名称不影响共享额度。</p><button id="save">检查连接并保存</button><p id="result" role="status"></p><a id="panel" href="http://127.0.0.1:18765/" target="_blank" rel="noopener">打开控制页面</a><p class="small">服务断开时保持网站限制。已绑定的扩展不能切换到另一套数据。浏览器隐私窗口需单独授予权限。</p></main><script src="connection.js"></script><script src="options.js"></script></body></html>
