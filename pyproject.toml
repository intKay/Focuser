[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focuser-local"
version = "1.3.0rc2"
description = "Free local browser and desktop screen-time budgets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
desktop = ["psutil>=5.9,<8; sys_platform == 'win32'", "pystray>=0.19,<1; sys_platform == 'win32'", "Pillow>=10,<13; sys_platform == 'win32'"]
dev = ["build>=1,<2"]

[project.scripts]
focuser = "screen_time_server:main"
focuser-release = "screen_time_release:main"
focuser-startup = "screen_time_startup:main"

[tool.setuptools]
py-modules = ["screen_time_core", "screen_time_storage", "screen_time_challenge", "screen_time_server", "screen_time_runtime", "screen_time_platform", "screen_time_windows", "screen_time_gate", "screen_time_launcher", "screen_time_release", "screen_time_startup", "screen_time_i18n", "screen_time_setup", "screen_time_config"]
packages = ["focuser_assets"]
package-dir = {"" = "scripts", "focuser_assets" = "resources/screen_time"}
include-package-data = false

[tool.setuptools.package-data]
focuser_assets = ["web/*.html", "web/*.js", "web/*.css", "extension/*.html", "extension/*.js", "extension/*.css", "extension/*.json", "extension/vendor/*.js", "extension/vendor/*.txt", "extension/vendor/*.md", "LICENSE"]
